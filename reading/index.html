      <template><h2>纳瓦尔宝典</h2><p class="meta">#81</p><p>其实已经看了很多他写的<a href="https://nav.al/" target="_blank" rel="noopener">博客</a>，也听了不少关于他的 podacst，其中有很多很有意思的观点。最近认真的把这本小书从头到尾看了一遍。</p>
<p>他对阅读的观点也很有启发，他认为：阅读不应该追求“读完 xxx 本书”，阅读是为了追求“理解”。有的时候他会从书中找到他感兴趣的概念，完全理解了概念之后就直接放下这本书，继续读其他的书。</p>
<blockquote>把阅读当成一种有选择的主动行为，而不是一打开书本就被动接受信息。</blockquote>
<p>他还认为：反复阅读并深刻理解 100 本好书，要比泛泛地阅读大量书籍更好。</p>
<blockquote>Joe Rogan 对他的采访 <a href="https://youtu.be/3qHkcs3kG44?si=1GoW3hiejGqazXiO" target="_blank" rel="noopener">https://youtu.be/3qHkcs3kG44?si=1GoW3hiejGqazXiO</a></blockquote></template>
