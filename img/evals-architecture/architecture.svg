<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 920" width="1320" height="920" role="img" aria-label="Eval architecture: the case repo, task cases and CLI flags feed the runner run.py (load cases, schedule, build sandboxes); the runner gives the new and old versions one sandbox each, both calling the mocks in evals/bin; results go through kinds, norm and report; a broken copy and STALE check the evals themselves" lang="en" font-family="&quot;JetBrains Mono&quot;, ui-monospace, SFMono-Regular, Menlo, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, monospace"><defs><marker id="fah-6e7681" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#6e7681"/></marker><marker id="fah-79c0ff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#79c0ff"/></marker><marker id="fah-ffa657" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#ffa657"/></marker></defs><rect width="1320" height="920" fill="#0b0e14"/><text x="20" y="34" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">blue = new version · orange = old version · dashed = checks on the evals</text><rect x="20" y="90" width="290" height="170" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="40" y="128" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">Case repo</text><text x="40" y="164" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">cases/&lt;area&gt;/&lt;name&gt;</text><text x="40" y="196" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">case.json + inputs</text><text x="40" y="228" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">107 cases, private</text><rect x="20" y="290" width="290" height="140" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="40" y="328" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">Task cases</text><text x="40" y="364" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">--cases, run here</text><text x="40" y="396" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">then merge in</text><rect x="20" y="460" width="290" height="170" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="40" y="498" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">CLI flags</text><text x="40" y="534" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">--new: edited copy</text><text x="40" y="566" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">--old: skill in use</text><text x="40" y="598" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">-k / --tag / --kind</text><rect x="330" y="70" width="300" height="600" rx="16" fill="none" stroke="#2d3440" stroke-width="2.5"/><text x="348" y="106" font-size="24" font-weight="700" fill="#d6dde6" text-anchor="start">Runner run.py</text><rect x="346" y="130" width="268" height="160" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="366" y="168" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">lib/cases.py</text><text x="366" y="204" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">load, filter</text><text x="366" y="236" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">copy frozen input</text><text x="366" y="268" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">fill placeholders</text><rect x="346" y="314" width="268" height="160" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="366" y="352" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">Scheduler</text><text x="366" y="388" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">fast: 8 threads</text><text x="366" y="420" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">slow: one by one</text><text x="366" y="452" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">retry once</text><rect x="346" y="498" width="268" height="160" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="366" y="536" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">lib/sandbox.py</text><text x="366" y="572" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">new dir per run</text><text x="366" y="604" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">used as fake HOME</text><text x="366" y="636" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">real env cleared</text><path d="M310 175 L330 175" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><path d="M310 360 L330 360" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><path d="M310 545 L330 545" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="650" y="70" width="320" height="600" rx="16" fill="none" stroke="#2d3440" stroke-width="2.5"/><text x="668" y="106" font-size="24" font-weight="700" fill="#d6dde6" text-anchor="start">One sandbox per side</text><rect x="666" y="130" width="288" height="140" rx="12" fill="#11151d" stroke="#79c0ff" stroke-width="2"/><text x="686" y="168" font-size="26" font-weight="700" fill="#79c0ff" text-anchor="start">New version</text><text x="686" y="204" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">runs scripts/*</text><text x="686" y="236" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">step&lt;N&gt;.out.txt</text><rect x="666" y="310" width="288" height="200" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="686" y="348" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">evals/bin mocks</text><text x="686" y="384" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">herdr: fake, logs</text><text x="686" y="416" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">zsh: fixed JSON</text><text x="686" y="448" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">ssh: table replies</text><text x="686" y="480" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">nohup: no daemons</text><rect x="666" y="550" width="288" height="108" rx="12" fill="#11151d" stroke="#ffa657" stroke-width="2"/><text x="686" y="588" font-size="26" font-weight="700" fill="#ffa657" text-anchor="start">Old version</text><text x="686" y="624" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">same steps, input</text><path d="M810 270 L810 310" fill="none" stroke="#79c0ff" stroke-width="3" marker-end="url(#fah-79c0ff)"/><path d="M810 550 L810 510" fill="none" stroke="#ffa657" stroke-width="3" marker-end="url(#fah-ffa657)"/><path d="M630 200 L650 200" fill="none" stroke="#79c0ff" stroke-width="3" marker-end="url(#fah-79c0ff)"/><path d="M630 604 L650 604" fill="none" stroke="#ffa657" stroke-width="3" marker-end="url(#fah-ffa657)"/><rect x="1000" y="70" width="300" height="200" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="1020" y="108" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">kinds/ judge</text><text x="1020" y="144" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">unit: test file</text><text x="1020" y="176" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">classify: in→out</text><text x="1020" y="208" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">herdr-stub: expect</text><text x="1020" y="240" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">corpus: pointers</text><rect x="1000" y="310" width="300" height="140" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="1020" y="348" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">lib/norm.py</text><text x="1020" y="384" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">drop times, paths</text><text x="1020" y="416" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">diff old/new stdout</text><rect x="1000" y="490" width="300" height="180" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="1020" y="528" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">lib/report.py</text><text x="1020" y="564" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">report.md summary</text><text x="1020" y="596" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">results.json</text><path d="M970 170 L1000 170" fill="none" stroke="#79c0ff" stroke-width="3" marker-end="url(#fah-79c0ff)"/><path d="M970 604 L985 604 L985 220 L1000 220" fill="none" stroke="#ffa657" stroke-width="3" marker-end="url(#fah-ffa657)"/><path d="M1150 270 L1150 310" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><path d="M1150 450 L1150 490" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><text x="20" y="736" font-size="24" font-weight="700" fill="#8b949e" text-anchor="start">Checks on the evals</text><rect x="20" y="756" width="630" height="140" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2" stroke-dasharray="8 6"/><text x="40" y="794" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">Broken copy</text><text x="40" y="830" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">--new = a copy with old bugs put back</text><text x="40" y="862" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">the suite must go red</text><rect x="670" y="756" width="630" height="140" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2" stroke-dasharray="8 6"/><text x="690" y="794" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">STALE</text><text x="690" y="830" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">described code changed, not re-checked</text><text x="690" y="862" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">neither pass nor fail</text></svg>
