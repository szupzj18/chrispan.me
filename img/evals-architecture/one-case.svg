<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1244" width="1320" height="1244" role="img" aria-label="One diff-mode case in order: the runner loads cases; the sandbox builds a dir per version and copies inputs; each step runs in the fake HOME, the tested script calls the fake herdr, which replies per scenario and logs the call; then the runner checks expectations, compares old and new output, records the result and writes the report" lang="en" font-family="&quot;JetBrains Mono&quot;, ui-monospace, SFMono-Regular, Menlo, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, monospace"><defs><marker id="fah-6e7681" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9z" fill="#6e7681"/></marker></defs><rect width="1320" height="1244" fill="#0b0e14"/><rect x="20" y="20" width="260" height="100" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="40" y="58" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">Runner</text><text x="40" y="94" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">run.py</text><rect x="360" y="20" width="260" height="100" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="380" y="58" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">Sandbox</text><text x="380" y="94" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">lib/sandbox.py</text><rect x="700" y="20" width="260" height="100" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="720" y="58" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">Tested script</text><text x="720" y="94" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">new or old</text><rect x="1020" y="20" width="280" height="100" rx="12" fill="#11151d" stroke="#2d3440" stroke-width="2"/><text x="1040" y="58" font-size="26" font-weight="700" fill="#d6dde6" text-anchor="start">Fake herdr</text><text x="1040" y="94" font-size="22" font-weight="400" fill="#8b949e" text-anchor="start">lib/fakeherdr.py</text><path d="M150 170 H190 V204 H156" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="204" y="153" width="30" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="219" y="176" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">1</text><text x="244" y="176" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">load cases,</text><text x="244" y="206" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">filter by tag</text><path d="M150 300 L486 300" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="164" y="231" width="30" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="179" y="254" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">2</text><text x="204" y="254" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">one thread per side:</text><text x="204" y="284" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">try&lt;N&gt;/new and /old</text><path d="M490 340 H530 V374 H496" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="544" y="323" width="30" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="559" y="346" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">3</text><text x="584" y="346" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">copy inputs,</text><text x="584" y="376" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">write scenario,</text><text x="584" y="406" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">fill placeholders</text><path d="M490 500 L826 500" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="504" y="431" width="30" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="519" y="454" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">4</text><text x="544" y="454" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">in the fake HOME,</text><text x="544" y="484" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">run step N</text><path d="M830 600 L1156 600" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="844" y="531" width="30" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="859" y="554" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">5</text><text x="884" y="554" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">herdr agent get,</text><text x="884" y="584" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">prompt, send-keys</text><path d="M1160 700 L834 700" fill="none" stroke="#6e7681" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#fah-6e7681)"/><rect x="844" y="631" width="30" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="859" y="654" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">6</text><text x="884" y="654" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">reply per scenario,</text><text x="884" y="684" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">log to herdr.log</text><path d="M830 800 L494 800" fill="none" stroke="#6e7681" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#fah-6e7681)"/><rect x="504" y="731" width="30" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="519" y="754" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">7</text><text x="544" y="754" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">output saved to</text><text x="544" y="784" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">step&lt;N&gt;.out.txt</text><path d="M44 430 H34 V816 H44" fill="none" stroke="#e3b341" stroke-width="2.5"/><text font-size="22" font-weight="400" fill="#e3b341" text-anchor="middle" transform="translate(22,623) rotate(-90)">repeat per step</text><path d="M490 900 L154 900" fill="none" stroke="#6e7681" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#fah-6e7681)"/><rect x="164" y="831" width="30" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="179" y="854" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">8</text><text x="204" y="854" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">step results and</text><text x="204" y="884" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">herdr calls seen</text><line x1="490" y1="120" x2="490" y2="930" stroke="#2d3440" stroke-width="2" stroke-dasharray="6 6"/><line x1="830" y1="120" x2="830" y2="930" stroke="#2d3440" stroke-width="2" stroke-dasharray="6 6"/><line x1="1160" y1="120" x2="1160" y2="930" stroke="#2d3440" stroke-width="2" stroke-dasharray="6 6"/><path d="M150 970 H190 V1004 H156" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="204" y="953" width="30" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="219" y="976" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">9</text><text x="244" y="976" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">check expect: output, files, fake herdr call counts</text><path d="M150 1040 H190 V1074 H156" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="204" y="1023" width="44" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="226" y="1046" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">10</text><text x="258" y="1046" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">diff mode: normalize old and new stdout, compare byte by byte</text><path d="M150 1110 H190 V1144 H156" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="204" y="1093" width="44" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="226" y="1116" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">11</text><text x="258" y="1116" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">PASS / FAIL; a failed slow case reruns once in a new dir</text><path d="M150 1180 H190 V1214 H156" fill="none" stroke="#6e7681" stroke-width="3" marker-end="url(#fah-6e7681)"/><rect x="204" y="1163" width="44" height="30" rx="15" fill="none" stroke="#d6dde6" stroke-width="2"/><text x="226" y="1186" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="middle">12</text><text x="258" y="1186" font-size="22" font-weight="400" fill="#d6dde6" text-anchor="start">when all cases are done, write report.md and results.json</text><line x1="150" y1="120" x2="150" y2="1234" stroke="#2d3440" stroke-width="2" stroke-dasharray="6 6"/></svg>
