name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1' # Mondays 01:17 UTC (09:17 in Beijing): refresh data.json, then deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the weekly run commits the refreshed data.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Weekly and manual runs refresh data.json. A fetch error or implausible data fails the run
      # (GitHub emails the failure) before anything is committed or deployed.
      - if: github.event_name != 'push'
        run: node scripts/data.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - if: github.event_name != 'push'
        run: |
          git diff --quiet -- data.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898182+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'Refresh data.json' -- data.json
          git pull -q --rebase && git push -q
      - run: node scripts/build.mjs
      # /v3/chrispan-resume.pdf, printed by the Google Chrome that ships with the runner image.
      # The image has no CJK font, so Chinese post titles would print as empty boxes.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
      - run: node scripts/pdf.mjs
      - run: node scripts/pdf.mjs --lang zh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
